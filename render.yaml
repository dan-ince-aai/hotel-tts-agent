# Render Blueprint for the hotel-desk blind test's WEB APP: the participants' page, the study
# API, the admin page, and the agent's private API, with its Postgres.
#
# The voice side is not here: the audio runs on LiveKit Cloud and the desk agent (agent/) is
# deployed there with `lk agent create`. See README.md, "Deploying".
#
# Apply it from Render: New → Blueprint → point at this repo. Render creates the web service
# and the managed Postgres below, wires DATABASE_URL between them, prompts for the values
# marked `sync: false`, and generates the two secrets marked `generateValue`.

databases:
  - name: hotel-tts-db
    # Paid Basic tier. NOT the free tier, which Render deletes after 30 days.
    plan: basic-256mb
    postgresMajorVersion: "16"
    region: oregon

services:
  - type: web
    name: hotel-tts-agent
    runtime: node
    # Paid, always-on. The free web plan sleeps when idle, and a participant would wait for it
    # to wake.
    plan: starter
    region: oregon
    # Builds the page into dist/client; the server itself runs from source (Node strips types).
    buildCommand: npm ci && npm run build
    startCommand: node server.ts
    healthCheckPath: /health
    envVars:
      # Render routes outside traffic only to a service bound to 0.0.0.0.
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT; server.ts reads it.
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-tts-db
          property: connectionString
      # From the LiveKit Cloud project (Settings → API keys).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # The shared secret the desk agent uses on /internal/*. Render generates it; copy it
      # into the agent's LiveKit Cloud secrets as STUDY_AGENT_SECRET.
      - key: STUDY_AGENT_SECRET
        generateValue: true
      # The /admin page's password, which also unlocks the CSV exports.
      - key: STUDY_ADMIN_PASSWORD
        sync: false
      # A generated alternative to the password, for scripts downloading the CSVs.
      - key: STUDY_ADMIN_TOKEN
        generateValue: true
